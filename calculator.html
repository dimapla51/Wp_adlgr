<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f0f14;
      --surface: #1a1a24;
      --card:    #22222f;
      --border:  #2e2e40;
      --accent:  #a78bfa;
      --accent2: #f472b6;
      --text:    #e2e2f0;
      --muted:   #888899;
      --radius:  16px;
      --shadow:  0 8px 32px rgba(0,0,0,.45);
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    header {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
      padding: 20px 32px;
      text-align: center;
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%;
      max-width: 360px;
      position: relative;
      overflow: hidden;
    }
    header::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 60% 40%, rgba(167,139,250,.2) 0%, transparent 70%);
      pointer-events: none;
    }
    header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .calc-wrapper {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 var(--radius) var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      width: 100%;
      max-width: 360px;
    }

    /* Display */
    .display {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
      min-height: 96px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 6px;
      overflow: hidden;
    }
    .display .expression {
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 1.2em;
      word-break: break-all;
      text-align: right;
    }
    .display .result {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -1px;
      word-break: break-all;
      text-align: right;
      line-height: 1.1;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    /* Buttons */
    button {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 600;
      padding: 18px 0;
      cursor: pointer;
      transition: background .15s, transform .1s, box-shadow .15s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover {
      background: #2a2a3a;
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
    }
    button:active {
      transform: scale(.94);
      background: #1e1e2a;
    }

    /* Operator buttons */
    button.op {
      background: linear-gradient(135deg, #312e81, #4c1d95);
      border-color: #5b21b6;
      color: var(--accent);
    }
    button.op:hover {
      background: linear-gradient(135deg, #3b369a, #5b21b6);
    }

    /* Equals button */
    button.eq {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color: transparent;
      color: #fff;
      font-size: 1.4rem;
    }
    button.eq:hover {
      filter: brightness(1.1);
    }

    /* Clear/special */
    button.clear {
      background: linear-gradient(135deg, #7f1d1d, #991b1b);
      border-color: #b91c1c;
      color: #fca5a5;
    }
    button.clear:hover {
      background: linear-gradient(135deg, #991b1b, #b91c1c);
    }

    button.special {
      background: #1e2a1e;
      border-color: #2d3d2d;
      color: #86efac;
    }
    button.special:hover {
      background: #243224;
    }

    /* Span full width */
    button.span2 {
      grid-column: span 2;
    }

    /* History */
    .history-toggle {
      margin-top: 16px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 8px 0;
      width: 100%;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .history-toggle:hover { color: var(--accent); border-color: var(--accent); }

    .history {
      display: none;
      margin-top: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      max-height: 160px;
      overflow-y: auto;
    }
    .history.open { display: block; }
    .history-item {
      font-size: 0.82rem;
      color: var(--muted);
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: color .15s;
    }
    .history-item:last-child { border-bottom: none; }
    .history-item:hover { color: var(--accent); }
    .history-item span { color: var(--text); font-weight: 600; }
    .history-empty { font-size: 0.82rem; color: var(--muted); text-align: center; padding: 8px 0; }

    /* Scrollbar */
    .history::-webkit-scrollbar { width: 4px; }
    .history::-webkit-scrollbar-track { background: transparent; }
    .history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Keyboard hint */
    .hint {
      margin-top: 14px;
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      letter-spacing: .5px;
    }
  </style>
</head>
<body>

<header>
  <h1>Calculadora</h1>
</header>

<div class="calc-wrapper">
  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>

  <div class="grid">
    <!-- Row 1 -->
    <button class="clear"    onclick="clearAll()">AC</button>
    <button class="special"  onclick="toggleSign()">+/−</button>
    <button class="special"  onclick="percent()">%</button>
    <button class="op"       onclick="inputOp('÷')">÷</button>

    <!-- Row 2 -->
    <button onclick="inputDigit('7')">7</button>
    <button onclick="inputDigit('8')">8</button>
    <button onclick="inputDigit('9')">9</button>
    <button class="op" onclick="inputOp('×')">×</button>

    <!-- Row 3 -->
    <button onclick="inputDigit('4')">4</button>
    <button onclick="inputDigit('5')">5</button>
    <button onclick="inputDigit('6')">6</button>
    <button class="op" onclick="inputOp('−')">−</button>

    <!-- Row 4 -->
    <button onclick="inputDigit('1')">1</button>
    <button onclick="inputDigit('2')">2</button>
    <button onclick="inputDigit('3')">3</button>
    <button class="op" onclick="inputOp('+')">+</button>

    <!-- Row 5 -->
    <button onclick="inputDigit('0')" class="span2">0</button>
    <button onclick="inputDot()">.</button>
    <button class="eq" onclick="calculate()">=</button>
  </div>

  <button class="history-toggle" onclick="toggleHistory()" id="histBtn">
    Historial ▾
  </button>
  <div class="history" id="history"></div>

  <p class="hint">También puedes usar el teclado numérico</p>
</div>

<script>
  let currentInput = '0';
  let expression   = '';
  let operator     = null;
  let prevValue    = null;
  let justCalc     = false;
  let historyList  = [];

  const resultEl     = document.getElementById('result');
  const expressionEl = document.getElementById('expression');
  const historyEl    = document.getElementById('history');

  function updateDisplay() {
    resultEl.textContent     = formatNum(currentInput);
    expressionEl.textContent = expression;
  }

  function formatNum(val) {
    if (val === '' || val === '-') return val || '0';
    const n = parseFloat(val);
    if (isNaN(n)) return val;
    // Avoid exponential for reasonable sizes
    if (Math.abs(n) > 1e12) return n.toExponential(4);
    const parts = val.split('.');
    const intPart = parseInt(parts[0], 10).toLocaleString('es');
    return parts.length > 1 ? intPart + '.' + parts[1] : intPart;
  }

  function inputDigit(d) {
    if (justCalc) { currentInput = d; expression = ''; justCalc = false; }
    else if (currentInput === '0' && d !== '0') currentInput = d;
    else if (currentInput.length < 15) currentInput += d;
    updateDisplay();
  }

  function inputDot() {
    if (justCalc) { currentInput = '0.'; expression = ''; justCalc = false; }
    else if (!currentInput.includes('.')) currentInput += '.';
    updateDisplay();
  }

  function inputOp(op) {
    justCalc = false;
    if (operator && !justCalc && expression !== '') {
      compute();
    }
    prevValue  = parseFloat(currentInput);
    operator   = op;
    expression = formatNum(currentInput) + ' ' + op;
    currentInput = '0';
    updateDisplay();
  }

  function compute() {
    if (prevValue === null || operator === null) return null;
    const a = prevValue;
    const b = parseFloat(currentInput);
    let res;
    switch (operator) {
      case '+': res = a + b; break;
      case '−': res = a - b; break;
      case '×': res = a * b; break;
      case '÷': res = b === 0 ? 'Error' : a / b; break;
      default:  return;
    }
    return res;
  }

  function calculate() {
    if (prevValue === null || operator === null) return;
    const b   = parseFloat(currentInput);
    const res = compute();
    if (res === undefined) return;

    const fullExpr = expression + ' ' + formatNum(currentInput) + ' =';
    const resStr   = res === 'Error' ? 'Error' : String(parseFloat(res.toFixed(10)));

    addHistory(fullExpr, resStr);
    expression   = fullExpr;
    currentInput = resStr;
    prevValue    = null;
    operator     = null;
    justCalc     = true;
    updateDisplay();
  }

  function clearAll() {
    currentInput = '0';
    expression   = '';
    operator     = null;
    prevValue    = null;
    justCalc     = false;
    updateDisplay();
  }

  function toggleSign() {
    if (currentInput === '0' || currentInput === 'Error') return;
    currentInput = currentInput.startsWith('-')
      ? currentInput.slice(1)
      : '-' + currentInput;
    updateDisplay();
  }

  function percent() {
    const n = parseFloat(currentInput);
    if (isNaN(n)) return;
    currentInput = String(n / 100);
    updateDisplay();
  }

  /* History */
  function addHistory(expr, res) {
    historyList.unshift({ expr, res });
    if (historyList.length > 20) historyList.pop();
    renderHistory();
  }

  function renderHistory() {
    if (historyList.length === 0) {
      historyEl.innerHTML = '<p class="history-empty">Sin historial</p>';
      return;
    }
    historyEl.innerHTML = historyList.map((h, i) =>
      `<div class="history-item" onclick="loadHistory(${i})">${h.expr} <span>${h.res}</span></div>`
    ).join('');
  }

  function loadHistory(i) {
    currentInput = historyList[i].res;
    expression   = '';
    operator     = null;
    prevValue    = null;
    justCalc     = true;
    updateDisplay();
  }

  function toggleHistory() {
    historyEl.classList.toggle('open');
    document.getElementById('histBtn').textContent =
      historyEl.classList.contains('open') ? 'Historial ▴' : 'Historial ▾';
    if (historyEl.classList.contains('open')) renderHistory();
  }

  /* Keyboard support */
  document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
    else if (e.key === '.') inputDot();
    else if (e.key === '+') inputOp('+');
    else if (e.key === '-') inputOp('−');
    else if (e.key === '*') inputOp('×');
    else if (e.key === '/') { e.preventDefault(); inputOp('÷'); }
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Backspace') {
      if (currentInput.length > 1) currentInput = currentInput.slice(0, -1);
      else currentInput = '0';
      updateDisplay();
    }
    else if (e.key === 'Escape') clearAll();
  });

  updateDisplay();
</script>
</body>
</html>
