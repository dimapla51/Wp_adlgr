services:
  diario:
    build: .
    pull_policy: build
    image: diario-del-dia:latest
    container_name: diario-del-dia
    restart: unless-stopped
    ports:
      - "8080:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-diario
    restart: unless-stopped
    network_mode: host
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - diario
